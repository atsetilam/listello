version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
listello-agent = { path = "../listello-agent" }
listello-protocol.workspace = true
listello-surface.workspace = true
listello-ui.workspace = true

cairo-rs.workspace = true
chrono.workspace = true
input-linux.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit = "0.22"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = "0.10"
