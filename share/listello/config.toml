# listello config template. Do not edit this file directly, instead
# copy it to /etc/listello/config.toml and edit that copy.
#
# M1 phase 06 note: this replaces tiny-dfr's fixed-row PascalCase schema (PrimaryLayerKeys,
# MediaLayerKeys, DoublePressSwitchLayers, ShowButtonOutlines, EnablePixelShift, FontTemplate)
# with listello's own: an ordered [[widget]] list (D8 — a personal layout is one of these
# files, not a default anyone is stuck with). Icons, battery, time-format widgets, an
# Fn-triggered alternate layer and pixel-shift/font/outline settings are not in this schema
# yet — see crates/listello-core/src/config.rs's header for what M1 dismantled and did not
# yet rebuild. What you see below is a plain row of function keys plus a clock: enough to
# prove the chain end to end, not a finished layout.

# The language of the text listello puts on the strip (a clock's day and month names):
# "system" (the default: the system's date and time format), "italian" or "english".
# A clock's own `locale` still wins for that clock.
[general]
language = "system"

[strip]
gap = 12.0

[[widget]]
kind = "button"
label = "F1"
keys = ["F1"]

[[widget]]
kind = "button"
label = "F2"
keys = ["F2"]

[[widget]]
kind = "button"
label = "F3"
keys = ["F3"]

[[widget]]
kind = "button"
label = "F4"
keys = ["F4"]

[[widget]]
kind = "button"
label = "F5"
keys = ["F5"]

[[widget]]
kind = "button"
label = "F6"
keys = ["F6"]

[[widget]]
kind = "button"
label = "F7"
keys = ["F7"]

[[widget]]
kind = "button"
label = "F8"
keys = ["F8"]

[[widget]]
kind = "button"
label = "F9"
keys = ["F9"]

[[widget]]
kind = "button"
label = "F10"
keys = ["F10"]

[[widget]]
kind = "button"
label = "F11"
keys = ["F11"]

[[widget]]
kind = "button"
label = "F12"
keys = ["F12"]

[[widget]]
kind = "separator"

[[widget]]
kind = "clock"
format = "%H:%M"
width = 160.0

# Held Fn swaps the whole strip for this one. Labels are text until buttons can carry icons.
# For media keys by default and F1-F12 under Fn, swap the two lists in /etc/listello/config.toml.

[[fn_widget]]
kind = "button"
label = "Dim"
keys = ["BrightnessDown"]

[[fn_widget]]
kind = "button"
label = "Bright"
keys = ["BrightnessUp"]

[[fn_widget]]
kind = "button"
label = "Mic"
keys = ["MicMute"]

[[fn_widget]]
kind = "button"
label = "Find"
keys = ["Search"]

[[fn_widget]]
kind = "button"
label = "Kb-"
keys = ["IllumDown"]

[[fn_widget]]
kind = "button"
label = "Kb+"
keys = ["IllumUp"]

[[fn_widget]]
kind = "button"
label = "Prev"
keys = ["PreviousSong"]

[[fn_widget]]
kind = "button"
label = "Play"
keys = ["PlayPause"]

[[fn_widget]]
kind = "button"
label = "Next"
keys = ["NextSong"]

[[fn_widget]]
kind = "button"
label = "Mute"
keys = ["Mute"]

[[fn_widget]]
kind = "button"
label = "Vol-"
keys = ["VolumeDown"]

[[fn_widget]]
kind = "button"
label = "Vol+"
keys = ["VolumeUp"]

# Hardware settings a widget cannot describe (config.rs's CoreSettings). Both shown at their
# defaults; delete a line to fall back to it explicitly, or omit the whole table.
[core]
adaptive_brightness = true
active_brightness = 128
