name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Everything runs in debian:trixie rather than on the ubuntu-latest image, for one
  # specific reason: librsvg-rebind needs librsvg >= 2.59 and Ubuntu 24.04 ships 2.58.
  # Trixie ships 2.60.
  check:
    name: build, clippy, test, fmt (x86_64)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install system dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates curl git pkg-config \
            libcairo2-dev libfontconfig1-dev libfreetype-dev libgdk-pixbuf-2.0-dev \
            libglib2.0-dev libinput-dev librsvg2-dev libudev-dev
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --component rustfmt,clippy --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  # Apple Silicon Macs under Asahi are aarch64, so aarch64 has to keep compiling. This job
  # runs under QEMU and is slow, so it is limited to main rather than every push to a branch.
  aarch64:
    name: build (aarch64, emulated)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build in an aarch64 trixie container
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/src" -w /src debian:trixie bash -c '
            set -eux
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              build-essential ca-certificates curl pkg-config \
              libcairo2-dev libfontconfig1-dev libfreetype-dev libgdk-pixbuf-2.0-dev \
              libglib2.0-dev libinput-dev librsvg2-dev libudev-dev
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --no-modify-path
            . "$HOME/.cargo/env"
            cargo build --workspace
          '

  # The simulator (M1) has to build on macOS -- it shows the strip on a machine that has not
  # moved to Linux yet (D10). Nothing Linux-only may leak above the Surface line, and this job is what proves it.
  macos:
    name: build (macOS, host-agnostic crates)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p listello-protocol -p listello-surface -p listello-agent
      - run: cargo test -p listello-protocol -p listello-surface
